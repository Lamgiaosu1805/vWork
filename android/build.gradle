buildscript {
  repositories {
    google()
    mavenCentral()
  }
  dependencies {
    classpath('com.android.tools.build:gradle')
    classpath('com.facebook.react:react-native-gradle-plugin')
    classpath('com.google.gms:google-services:4.4.1')
    classpath('org.jetbrains.kotlin:kotlin-gradle-plugin')
  }
}

def omiProperties = new Properties()
def omiPropertiesFile = file("local.properties")
if (omiPropertiesFile.exists()) {
    omiPropertiesFile.withInputStream { omiProperties.load(it) }
}

allprojects {
  repositories {
        maven { url 'https://jitpack.io' }
        maven {
            url 'https://maven.pkg.github.com/omicall/OMICall-SDK'
            credentials {
                username = System.getenv('OMI_USER') ?: omiProperties.getProperty('OMI_USER', '')
                password = System.getenv('OMI_TOKEN') ?: omiProperties.getProperty('OMI_TOKEN', '')
            }
            authentication { basic(BasicAuthentication) }
        }
    google()
    mavenCentral()
    maven { url 'https://www.jitpack.io' }
  }
}

apply plugin: "expo-root-project"
apply plugin: "com.facebook.react.rootproject"
